# cargo-deny: run by .github/workflows/security.yml — `cargo deny check`

[graph]
all-features = true

[advisories]
# Every RustSec advisory (vulnerable, unmaintained, unsound, yanked) fails the check
# unless listed here with a reason.
ignore = []

[licenses]
# Permissive licenses only, compatible with distributing The Pit under MIT with the Commons Clause.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9
# MPL-2.0 is file-level copyleft: fine to use unmodified from The Pit.
exceptions = [
    { crate = "option-ext", allow = ["MPL-2.0"] },
]

# The Pit itself is MIT with the Commons Clause (LICENSE), which has no SPDX
# identifier; the allow-list applies to its dependencies.
[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
# Dependencies come from crates.io only — no git or other registries.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
