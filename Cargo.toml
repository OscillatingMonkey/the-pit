[package]
name = "the-pit"
version = "0.1.1"
edition = "2021"
description = "The Pit: a local, encrypted secrets vault for developers, with an integration rail that pushes secrets where they need to go."
license = "AGPL-3.0-only"
readme = "README.md"
default-run = "pit"

[[bin]]
name = "pit"
path = "src/main.rs"

[dependencies]
regex = "1"
# Cryptography (RustCrypto, audited primitives only)
argon2 = { version = "0.5", features = ["std", "zeroize"] }
chacha20poly1305 = { version = "0.10", features = ["std"] }
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"
sha1 = "0.10"
subtle = "2.6"
zeroize = { version = "1.8", features = ["derive"] }
rand_core = { version = "0.6", features = ["getrandom"] }
getrandom = "0.2"
crypto_box = { version = "0.9", features = ["seal", "std"] }

# Serialization and encoding
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
base64 = "0.22"
data-encoding = "2.6"
hex = "0.4"

# CLI and console
clap = { version = "4.5", features = ["derive", "wrap_help"] }
rpassword = "7.3"
rustyline = { version = "14", default-features = false }
shell-words = "1.1"
zxcvbn = "3.1"

# System
libc = "0.2"
dirs = "5"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }

# Network (TLS only, rustls with webpki roots)
ureq = { version = "2.12", default-features = false, features = ["tls", "json"] }
qrcode = { version = "0.14", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSError"] }
objc2-local-authentication = { version = "0.3", features = ["LAContext", "LAError", "block2"] }
block2 = "0.6"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
debug = false
overflow-checks = true
