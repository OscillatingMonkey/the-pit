# Builds release binaries in GitHub Actions and publishes them with signed build provenance
# (SLSA, via Sigstore) and an SBOM. Anyone can verify a download:
#   gh attestation verify pit-<version>-<platform>.tar.gz --repo OscillatingMonkey/the-pit
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build (e.g. v0.1.0)
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-14
            platform: macos-arm64
          - os: ubuntu-latest
            platform: linux-x86_64
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-cyclonedx
      - name: Build
        run: |
          cargo build --locked --release
          name="pit-${TAG#v}-${{ matrix.platform }}"
          mkdir "$name" && cp target/release/pit LICENSE README.md "$name/"
          tar czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          cargo cyclonedx --format json --override-filename "pit-${TAG#v}" && mv "pit-${TAG#v}.json" "pit-${TAG#v}.cdx.json"
          echo "ASSET=$name.tar.gz" >> "$GITHUB_ENV"
          echo "SBOM=pit-${TAG#v}.cdx.json" >> "$GITHUB_ENV"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.ASSET }}
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: ${{ env.ASSET }}
          sbom-path: ${{ env.SBOM }}
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files="$ASSET $ASSET.sha256"
          [ "${{ matrix.platform }}" = "linux-x86_64" ] && files="$files $SBOM"
          gh release upload "$TAG" $files --clobber --repo "$GITHUB_REPOSITORY"
