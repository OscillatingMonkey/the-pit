# Test coverage, mutation testing, fuzzing and a dependency list (SBOM), published as a public
# report at https://oscillatingmonkey.github.io/the-pit/ (badges in the README read from there).
name: Assurance

on:
  push:
    branches: [main]
    paths: ["src/**", "tests/**", "fuzz/**", "Cargo.*", ".github/workflows/assurance.yml", "scripts/assurance-site"]
  schedule:
    - cron: "11 3 * * 0" # weekly
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: assurance
  cancel-in-progress: true

jobs:
  coverage:
    name: Coverage (unit, vectors and end-to-end)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-llvm-cov
      - name: Instrumented build, all tests
        env:
          CARGO_PROFILE_RELEASE_STRIP: "false"
          CARGO_PROFILE_RELEASE_LTO: "false"
          CARGO_PROFILE_RELEASE_PANIC: "unwind"
        run: |
          eval "$(cargo llvm-cov show-env --export-prefix)"
          cargo llvm-cov clean --workspace
          cargo build --locked --release
          cargo test --locked --release
          python3 -m venv .venv && .venv/bin/pip install --quiet --require-hashes -r tests/requirements.txt
          PIT_BIN="$CARGO_LLVM_COV_TARGET_DIR/release/pit" .venv/bin/python tests/e2e.py
          cargo llvm-cov report --release --html --output-dir out
          cargo llvm-cov report --release --json --summary-only --output-path out/summary.json
          cargo llvm-cov report --release --summary-only | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: out

  mutants:
    name: Mutation testing (security core)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-mutants
      - name: cargo mutants
        run: |
          set +e
          cargo mutants -j 4 --file src/crypto.rs --file src/codes.rs --file src/shamir.rs --file src/totp.rs
          { echo '## Mutation testing'; echo '```'; tail -n 5 mutants.out/debug.log 2>/dev/null; echo; echo "missed:"; cat mutants.out/missed.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutants
          path: |
            mutants.out/outcomes.json
            mutants.out/missed.txt
            mutants.out/caught.txt
            mutants.out/timeout.txt
            mutants.out/unviable.txt

  fuzz:
    name: Fuzzing (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [import_files, recovery_codes, snapshot, agent_request, sealed, totp]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@f0d5300ba8908d942c808f4d31c08471d7798ba3 # nightly
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-fuzz
      - name: Fuzz for 5 minutes with AddressSanitizer
        run: |
          set +e
          cargo fuzz run --target x86_64-unknown-linux-gnu ${{ matrix.target }} -- -max_total_time=300 -rss_limit_mb=2048 -print_final_stats=1 2>&1 | tee run.txt
          status=${PIPESTATUS[0]}
          mkdir -p result
          runs=$(grep -oE 'stat::number_of_executed_units: *[0-9]+' run.txt | grep -oE '[0-9]+$' | tail -1)
          echo "{\"target\": \"${{ matrix.target }}\", \"runs\": ${runs:-0}, \"seconds\": 300, \"ok\": $([ $status = 0 ] && echo true || echo false)}" > result/${{ matrix.target }}.json
          echo "### ${{ matrix.target }}: ${runs:-0} inputs, $([ $status = 0 ] && echo 'no crashes' || echo 'CRASH')" >> "$GITHUB_STEP_SUMMARY"
          exit $status
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: fuzz-${{ matrix.target }}
          path: |
            result
            fuzz/artifacts

  sbom:
    name: Dependency list (SBOM) and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-cyclonedx,cargo-audit,cargo-deny
      - run: |
          set +e
          mkdir -p out
          cargo cyclonedx --format json --override-filename the-pit.cdx && mv the-pit.cdx.json out/
          cargo audit --deny warnings > out/audit.txt 2>&1; echo $? > out/audit.status
          cargo deny check > out/deny.txt 2>&1; echo $? > out/deny.status
          exit 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: out

  publish:
    name: Publish the report
    if: always() && github.ref == 'refs/heads/main'
    needs: [coverage, mutants, fuzz, sbom]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: results
      - name: Build the report
        run: python3 scripts/assurance-site results site "${{ github.sha }}" "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
