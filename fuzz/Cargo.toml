[package]
name = "the-pit-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"
the-pit = { path = ".." }

[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "import_files"
path = "fuzz_targets/import_files.rs"
test = false
doc = false
bench = false

[[bin]]
name = "recovery_codes"
path = "fuzz_targets/recovery_codes.rs"
test = false
doc = false
bench = false

[[bin]]
name = "snapshot"
path = "fuzz_targets/snapshot.rs"
test = false
doc = false
bench = false

[[bin]]
name = "agent_request"
path = "fuzz_targets/agent_request.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sealed"
path = "fuzz_targets/sealed.rs"
test = false
doc = false
bench = false

[[bin]]
name = "totp"
path = "fuzz_targets/totp.rs"
test = false
doc = false
bench = false
